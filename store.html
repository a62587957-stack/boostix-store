<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boostix Store - بوستكس ستور</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body { background-color: #0b0e14; color: white; font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
    .header { background: linear-gradient(180deg, #111522, #0b0e14); padding: 30px 20px; border-bottom: 2px solid #00e6e6; }
    .title-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
    .app-icon { background: linear-gradient(135deg, #4f46e5, #00e6e6); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .title-text h1 { margin: 0; font-size: 22px; font-weight: bold; }
    .subtitle { font-size: 13px; color: #00e6e6; margin-top: 5px; }
    .time-badge { font-size: 12px; color: #00e6e6; font-weight: bold; margin-top: 5px; }
    .google-btn { background: white; color: black; padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px; }
    .nav-bar { display: flex; justify-content: center; gap: 12px; margin: 20px; padding: 0 10px; flex-direction: row-reverse;}
    .nav-btn { background: #161b22; border: 1px solid #30363d; color: white; padding: 15px 10px; border-radius: 12px; flex: 1; cursor: pointer; font-size: 13px; font-weight: bold; line-height: 1.5; }
    .nav-btn.active { border-color: #00e6e6; background: linear-gradient(135deg, #161b22, #004d4d); }
    .search-bar { background: #111522; border: 1px solid #00e6e6; padding: 14px; border-radius: 10px; margin: 0 20px; width: calc(100% - 70px); color: white; outline: none; }
</style>
<script>
  const SUPABASE_URL = "https://lxeloayuowzatrrlsasn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_m_-u5ofKmBmIldJz7VX7YA_D1QNNsPl";
  const sbClient = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "implicit"
        }
      })
    : null;

  let ACCESS_TOKEN = localStorage.getItem("saker_oauth_token") || "";
  let DATA = { user: null, products: [], myOrders: [], myDeposits: [], payInfo: { rate_syp: 15000 } };
  let activeTab = "shop";
  let mainCatFilter = "الألعاب";
  let subCatFilter = "";
  let searchQuery = "";
  let buyProdId = null;

  async function initAuthAndLoad() {
    try {
      if (window.location.hash && window.location.hash.includes("access_token=")) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accTok = hashParams.get("access_token");
        const refTok = hashParams.get("refresh_token") || "";
        if (accTok) {
          ACCESS_TOKEN = accTok;
          localStorage.setItem("saker_oauth_token", accTok);
          if (sbClient && sbClient.auth) {
            try { await sbClient.auth.setSession({ access_token: accTok, refresh_token: refTok }); } catch (e) {}
          }
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }

      if (window.location.search && window.location.search.includes("code=") && sbClient && sbClient.auth) {
        const code = new URLSearchParams(window.location.search).get("code");
        if (code) {
          try {
            const { data } = await sbClient.auth.exchangeCodeForSession(code);
            if (data && data.session && data.session.access_token) {
              ACCESS_TOKEN = data.session.access_token;
              localStorage.setItem("saker_oauth_token", ACCESS_TOKEN);
            }
          } catch (e) {}
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }

      if (sbClient && sbClient.auth) {
        try {
          const { data: { session } } = await sbClient.auth.getSession();
          if (session && session.access_token) {
            ACCESS_TOKEN = session.access_token;
            localStorage.setItem("saker_oauth_token", ACCESS_TOKEN);
          }
        } catch (e) {}

        sbClient.auth.onAuthStateChange((event, session) => {
          if (session && session.access_token) {
            ACCESS_TOKEN = session.access_token;
            localStorage.setItem("saker_oauth_token", ACCESS_TOKEN);
            loadStore();
          }
        });
      }
    } catch (e) {
      console.error("Auth init error:", e);
    }

    await loadStore();
  }

  async function signInWithGoogleOfficial() {
    if (!sbClient || !sbClient.auth) return alert("مكتبة تسجيل الدخول قيد التحميل، يرجى المحاولة بعد ثانية.");
    const { error } = await sbClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/" }
    });
    if (error) alert("خطأ في الاتصال بـ Google OAuth: " + error.message);
  }

  async function logoutGoogle() {
    try { if (sbClient && sbClient.auth) await sbClient.auth.signOut(); } catch (e) {}
    ACCESS_TOKEN = "";
    localStorage.removeItem("saker_oauth_token");
    showTab("shop");
    await loadStore();
  }

  async function loadStore() {
    try {
      const res = await fetch("/api/customer/bootstrap", {
        headers: ACCESS_TOKEN ? { "Authorization": "Bearer " + ACCESS_TOKEN } : {}
      });
      const d = await res.json();
      if (d && d.ok) {
        DATA = d;
        renderStore();
      }
    } catch (e) {
      console.error("Bootstrap error:", e);
    }
  }

  function fmtUSD(v) { return "$" + (Number(v) || 0).toFixed(2); }
  function fmtSYP(v) { return Math.round((Number(v) || 0) * (Number(DATA.payInfo && DATA.payInfo.rate_syp) || 15000)).toLocaleString("en-US") + " ل.س"; }

  function showTab(t) {
    if ((t === "wallet" || t === "orders") && !DATA.user) {
      signInWithGoogleOfficial();
      return;
    }
    activeTab = t;
    ["shop", "wallet", "orders"].forEach(k => {
      document.getElementById("tabbtn-" + k).classList.toggle("active", k === t);
      document.getElementById("sec-" + k).style.display = k === t ? "block" : "none";
    });
  }

  function renderIconHTML(iconVal, size = 54) {
    if (iconVal && (iconVal.startsWith("http://") || iconVal.startsWith("https://") || iconVal.startsWith("/"))) {
      return `<img src="${iconVal}" alt="icon" loading="lazy" style="width:${size}px; height:${size}px; border-radius:12px; object-fit:cover; border:1.5px solid var(--cyan); background:#070b14;" onerror="this.style.display='none'">`;
    }
    return `<div class="p-ico" style="width:${size}px; height:${size}px;">${iconVal || '🎮'}</div>`;
  }

  function onSearchInput(val) {
    searchQuery = (val || "").trim().toLowerCase();
    renderStore();
  }

  function selectMainCat(catName) {
    mainCatFilter = catName;
    subCatFilter = "";
    searchQuery = "";
    const inp = document.getElementById("store-search");
    if (inp) inp.value = "";
    renderStore();
  }

  function selectSubCat(subName) {
    subCatFilter = subName;
    renderStore();
    window.scrollTo({ top: 120, behavior: "smooth" });
  }

  function resetSubFilter() {
    subCatFilter = "";
    searchQuery = "";
    const inp = document.getElementById("store-search");
    if (inp) inp.value = "";
    renderStore();
  }

  function splitGameField(g) {
    const parts = (g || "الألعاب").split("|");
    const main = (parts[0] || "الألعاب").trim();
    const sub = (parts.slice(1).join("|") || main).trim();
    return { main, sub };
  }

  function openBuy(id) {
    if (!DATA.user) {
      signInWithGoogleOfficial();
      return;
    }
    buyProdId = id;
    const p = DATA.products.find(x => x.id === id);
    if (!p) return;
    const info = splitGameField(p.game);
    document.getElementById("bm-summary").innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <div style="display:flex; align-items:center; gap:10px;">
          ${renderIconHTML(p.icon, 48)}
          <div>
            <div style="font-size:12px; color:var(--cyan);">${info.main} - ${info.sub}</div>
            <div style="font-size:15px; font-weight:900;">${p.pack}</div>
          </div>
        </div>
        <div style="font-size:19px; font-weight:900; color:#fde68a; direction:ltr;">${fmtUSD(p.price_usd)}</div>
      </div>
    `;
    document.getElementById("bm-player-id").value = "";
    document.getElementById("buy-modal").classList.add("open");
  }

  async function confirmBuy() {
    const player_id = document.getElementById("bm-player-id").value.trim();
    if (!player_id) return alert("يرجى إدخال رقم الـ ID أو الحساب المطلوب");
    const res = await fetch("/api/customer/purchase", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ACCESS_TOKEN },
      body: JSON.stringify({ product_id: buyProdId, player_id })
    });
    const d = await res.json();
    if (!d.ok) {
      alert("⚠️ " + d.msg);
      if (d.need_deposit) {
        document.getElementById("buy-modal").classList.remove("open");
        showTab("wallet");
      }
      return;
    }
    document.getElementById("buy-modal").classList.remove("open");
    await loadStore();
    showTab("orders");
    alert("✅ تم استلام طلبك بنجاح! يمكنك متابعة حالته من قسم طلباتي.");
  }

  function updatePayBox() {
    const el = document.getElementById("dep-method");
    if (!el || !DATA.payInfo) return;
    const m = el.value;
    let txt = DATA.payInfo.sham_account || "";
    if (m.includes("سيريتل")) txt = DATA.payInfo.syriatel_account || "";
    if (m.includes("USDT")) txt = DATA.payInfo.usdt_account || "";
    document.getElementById("pay-account-box").textContent = "📌 حوّل إلى: " + txt;
  }

  function updateSYPPreview() {
    const v = parseFloat(document.getElementById("dep-amount").value) || 0;
    document.getElementById("dep-syp-hint").textContent = "المعادل بالليرة السورية: " + fmtSYP(v);
  }

  async function submitDeposit() {
    const method = document.getElementById("dep-method").value;
    const amount_usd = parseFloat(document.getElementById("dep-amount").value) || 0;
    const tx_id = document.getElementById("dep-tx").value.trim();
    const res = await fetch("/api/customer/deposit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ACCESS_TOKEN },
      body: JSON.stringify({ method, amount_usd, tx_id })
    });
    const d = await res.json();
    if (!d.ok) return alert("⚠️ " + d.msg);
    document.getElementById("dep-amount").value = "";
    document.getElementById("dep-tx").value = "";
    await loadStore();
    showTab("orders");
    alert("✅ تم إرسال طلب شحن الرصيد، سيتم إضافته لمحفظتك فور مطابقة رقم العملية.");
  }

  function renderStore() {
    if (DATA.user) {
      document.getElementById("logged-in-bar").style.display = "flex";
      document.getElementById("logged-out-bar").style.display = "none";
      document.getElementById("ui-balance").textContent = fmtUSD(DATA.user.balance);
      document.getElementById("ui-username").textContent = "👤 " + DATA.user.name + " (" + DATA.user.email + ")";
    } else {
      document.getElementById("logged-in-bar").style.display = "none";
      document.getElementById("logged-out-bar").style.display = "flex";
    }

    const orderedMains = [
      "الألعاب", "تطبيقات دردشة", "تواصل اجتماعي", "بطاقات شحن",
      "قسم الأرقام", "توثيق حسابات", "عملات و أرصدة", "ذكاء اصطناعي Ai",
      "شاشة VIP", "برامج تصميم", "Vpn مدفوع", "سحب رواتب"
    ];
    const products = DATA.products || [];
    const existingMains = [...new Set(products.map(p => splitGameField(p.game).main))];
    const mainCats = orderedMains.filter(m => existingMains.includes(m));
    existingMains.forEach(m => { if (!mainCats.includes(m)) mainCats.push(m); });

    if (!mainCats.includes(mainCatFilter) && mainCats.length > 0) {
      mainCatFilter = mainCats[0];
    }

    document.getElementById("game-filters").innerHTML = mainCats.map(m => {
      const count = products.filter(p => splitGameField(p.game).main === m).length;
      return `
        <button class="f-pill ${(!searchQuery && mainCatFilter === m) ? 'active' : ''}" onclick='selectMainCat(${JSON.stringify(m)})'>
          📂 ${m} <span style="font-size:11px; opacity:0.8;">(${count})</span>
        </button>
      `;
    }).join("");

    const backBtn = document.getElementById("btn-back-cats");
    const bread = document.getElementById("sub-breadcrumb");
    const grid = document.getElementById("products-grid");

    if (searchQuery || subCatFilter) {
      backBtn.style.display = "inline-block";
      bread.style.display = "block";
      let filtered = [];
      if (searchQuery) {
        filtered = products.filter(p =>
          (p.pack && p.pack.toLowerCase().includes(searchQuery)) ||
          (p.game && p.game.toLowerCase().includes(searchQuery))
        ).slice(0, 120);
        bread.textContent = `🔍 نتائج البحث عن "${searchQuery}" (${filtered.length} باقة):`;
      } else {
        filtered = products.filter(p => {
          const info = splitGameField(p.game);
          return info.main === mainCatFilter && info.sub === subCatFilter;
        });
        bread.textContent = `📂 ${mainCatFilter} ⬅️ ${subCatFilter} (${filtered.length} باقة متوفرة):`;
      }

      grid.innerHTML = filtered.map(p => {
        const info = splitGameField(p.game);
        return `
          <div class="p-card">
            <div>
              <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
                ${renderIconHTML(p.icon, 54)}
                <div>
                  <div class="p-game">${info.sub}</div>
                  <div class="p-name" style="margin:2px 0 0;">${p.pack}</div>
                </div>
              </div>
            </div>
            <div>
              <div class="p-price">
                <span style="font-size:19px; font-weight:900; color:#fde68a; direction:ltr;">${fmtUSD(p.price_usd)}</span>
                <span style="font-size:12px; color:var(--cyan); direction:ltr;">${fmtSYP(p.price_usd)}</span>
              </div>
              <button class="btn btn-cyan" style="width:100%;" onclick="openBuy(${p.id})">⚡ شراء فوري</button>
            </div>
          </div>
        `;
      }).join("") || `<div class="panel" style="grid-column:1/-1; text-align:center;">لا توجد باقات مطابقة.</div>`;
    } else {
      backBtn.style.display = "none";
      bread.style.display = "block";
      const inMain = products.filter(p => splitGameField(p.game).main === mainCatFilter);
      const subMap = new Map();
      inMain.forEach(p => {
        const sub = splitGameField(p.game).sub;
        if (!subMap.has(sub)) {
          subMap.set(sub, { name: sub, icon: p.icon, count: 0, minPrice: p.price_usd });
        }
        const entry = subMap.get(sub);
        entry.count++;
        if (p.price_usd < entry.minPrice) entry.minPrice = p.price_usd;
      });
      const subs = Array.from(subMap.values());
      bread.textContent = `📂 أقسام ${mainCatFilter} (${subs.length} قسم فرعي - اضغط على القسم لعرض باقاته):`;

      grid.innerHTML = subs.map(s => `
        <div class="p-card" style="cursor:pointer; text-align:center; align-items:center;" onclick='selectSubCat(${JSON.stringify(s.name)})'>
          <div style="margin-bottom:10px;">${renderIconHTML(s.icon, 74)}</div>
          <div class="p-name" style="font-size:15px; margin-bottom:6px;">${s.name}</div>
          <div style="font-size:12px; color:var(--cyan); font-weight:800; margin-bottom:12px;">
            📦 ${s.count} باقة | تبدأ من ${fmtUSD(s.minPrice)}
          </div>
          <button class="btn btn-cyan" style="width:100%;">عرض الباقات ⬅️</button>
        </div>
      `).join("");
    }

    updatePayBox();

    const myOrders = DATA.myOrders || [];
    document.getElementById("my-orders-tbody").innerHTML = myOrders.map(o => `
      <tr>
        <td><b>#${o.id}</b></td>
        <td>${o.date}</td>
        <td style="color:#fde68a;">${o.game} - ${o.pack_name}</td>
        <td><code style="color:var(--cyan);">${o.player_id}</code></td>
        <td style="color:#34d399;">${fmtUSD(o.price_usd)}</td>
        <td>${o.status}</td>
        <td style="font-size:12px; color:var(--muted);">${o.supplier_note || ''}</td>
      </tr>
    `).join("") || `<tr><td colspan="7" style="padding:18px; color:var(--muted);">لا توجد طلبات مسجلة في حسابك بعد.</td></tr>`;

    const myDeposits = DATA.myDeposits || [];
    document.getElementById("my-deps-tbody").innerHTML = myDeposits.map(d => `
      <tr>
        <td><b>#${d.id}</b></td>
        <td>${d.date}</td>
        <td>${d.method}</td>
        <td style="color:#fde68a;">+${fmtUSD(d.amount_usd)}</td>
        <td><code>${d.tx_id}</code></td>
        <td>${d.status}</td>
      </tr>
    `).join("") || `<tr><td colspan="6" style="padding:18px; color:var(--muted);">لا توجد عمليات إيداع سابقة.</td></tr>`;
  }

  initAuthAndLoad();
</script>
</body>
</html>
